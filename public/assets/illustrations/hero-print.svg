<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-label="Hasil cetak BisaPrint — lembar stiker die-cut, kartu nama, dan poster">
  <defs>
    <linearGradient id="sheetShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="cellPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F06292"/>
      <stop offset="1" stop-color="#DE127A"/>
    </linearGradient>
    <linearGradient id="cellOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4A261"/>
      <stop offset="1" stop-color="#E87817"/>
    </linearGradient>
    <linearGradient id="cellNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cellTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="cellGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cellViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="posterPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="330" cy="470" rx="270" ry="34" fill="#0F172A" opacity="0.16" filter="url(#soft)"/>

  <!-- poster roll (belakang) -->
  <g transform="translate(70 120) rotate(-14)">
    <rect x="0" y="0" width="86" height="330" rx="40" fill="url(#posterPink)"/>
    <rect x="0" y="0" width="86" height="330" rx="40" fill="#000" opacity="0.08"/>
    <ellipse cx="43" cy="18" rx="38" ry="14" fill="#FBCFE8"/>
    <ellipse cx="43" cy="18" rx="38" ry="14" fill="none" stroke="#9D174D" stroke-width="3"/>
    <rect x="10" y="70" width="66" height="10" rx="5" fill="#fff" opacity="0.55"/>
    <rect x="10" y="92" width="46" height="10" rx="5" fill="#fff" opacity="0.35"/>
    <rect x="10" y="200" width="66" height="120" rx="12" fill="#fff" opacity="0.18"/>
  </g>

  <!-- tumpukan kartu nama (belakang kanan) -->
  <g transform="translate(440 88) rotate(8)">
    <rect x="14" y="26" width="170" height="100" rx="12" fill="#E87817" opacity="0.85"/>
    <rect x="7" y="13" width="170" height="100" rx="12" fill="#F4A261"/>
    <rect x="0" y="0" width="170" height="100" rx="12" fill="#0F172A"/>
    <rect x="14" y="16" width="52" height="8" rx="4" fill="#fff" opacity="0.9"/>
    <rect x="14" y="32" width="86" height="6" rx="3" fill="#fff" opacity="0.45"/>
    <rect x="14" y="44" width="70" height="6" rx="3" fill="#fff" opacity="0.3"/>
    <circle cx="146" cy="78" r="12" fill="#DE127A"/>
    <path d="M140 78l4 4 8-8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lembar stiker die-cut (utama) -->
  <g transform="translate(160 96) rotate(-7)">
    <rect x="0" y="0" width="330" height="430" rx="18" fill="url(#sheetShade)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- crop marks -->
    <g stroke="#94A3B8" stroke-width="2">
      <path d="M14 26v-12M14 26h-12" /><path d="M316 26v-12M316 26h12"/>
      <path d="M14 404v12M14 404h-12"/><path d="M316 404v12M316 404h12"/>
    </g>

    <!-- grid stiker 3x3 -->
    <g>
      <!-- baris 1 -->
      <g transform="translate(30 46)">
        <rect width="82" height="104" rx="14" fill="url(#cellPink)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#DE127A" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <path d="M41 28l6.5 13.2 14.5 2.1-10.5 10.2 2.5 14.4-13-6.8-13 6.8 2.5-14.4L20 41.3l14.5-2.1z" fill="#fff" opacity="0.92"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>
      <g transform="translate(124 46)">
        <rect width="82" height="104" rx="14" fill="url(#cellOrange)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#E87817" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <circle cx="41" cy="44" r="20" fill="#fff" opacity="0.92"/>
        <path d="M33 44l6 6 12-12" stroke="#E87817" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>
      <g transform="translate(218 46)">
        <rect width="82" height="104" rx="14" fill="url(#cellNavy)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <path d="M46 26l-16 22h12l-6 20 18-24h-12z" fill="#fff" opacity="0.92"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>

      <!-- baris 2 -->
      <g transform="translate(30 164)">
        <rect width="82" height="104" rx="14" fill="url(#cellTeal)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#0D9488" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <path d="M41 30c-11 0-19 8-19 17s8 17 19 17 19-8 19-17-8-17-19-17zm0 26a9 9 0 110-18 9 9 0 010 18z" fill="#fff" opacity="0.92"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>
      <g transform="translate(124 164)">
        <rect width="82" height="104" rx="14" fill="url(#cellGold)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <path d="M28 34h26l-6 34H34z" fill="#fff" opacity="0.92"/>
        <path d="M30 34a11 11 0 0122 0" stroke="#fff" stroke-width="4" fill="none"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.6"/>
      </g>
      <g transform="translate(218 164)">
        <rect width="82" height="104" rx="14" fill="url(#cellPink)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#DE127A" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <path d="M41 30c-8-9-24-3-24 9 0 10 12 17 24 25 12-8 24-15 24-25 0-12-16-18-24-9z" fill="#fff" opacity="0.92"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>

      <!-- baris 3 -->
      <g transform="translate(30 282)">
        <rect width="82" height="104" rx="14" fill="url(#cellViolet)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <circle cx="41" cy="44" r="19" fill="none" stroke="#fff" stroke-width="4" opacity="0.92"/>
        <circle cx="41" cy="44" r="8" fill="#fff" opacity="0.92"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>
      <g transform="translate(124 282)">
        <rect width="82" height="104" rx="14" fill="url(#cellNavy)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <path d="M41 26l5 10 11 1.6-8 7.8 1.9 11-9.9-5.2-9.9 5.2 1.9-11-8-7.8 11-1.6z" fill="#fff" opacity="0.92"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>
      <g transform="translate(218 282)">
        <rect width="82" height="104" rx="14" fill="url(#cellOrange)"/>
        <rect width="82" height="104" rx="14" fill="none" stroke="#E87817" stroke-width="1.6" stroke-dasharray="5 4" transform="translate(-4 -4) scale(1.098 1.077)" opacity="0.5"/>
        <path d="M30 30h22v10H39v6h11v10H39v14h-9z" fill="#fff" opacity="0.92"/>
        <rect x="16" y="76" width="50" height="7" rx="3.5" fill="#fff" opacity="0.55"/>
      </g>
    </g>

    <!-- label bawah sheet -->
    <rect x="30" y="398" width="150" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="230" y="398" width="70" height="8" rx="4" fill="#DE127A" opacity="0.7"/>
  </g>

  <!-- badge mengambang: siap cetak -->
  <g transform="translate(486 250) rotate(6)">
    <rect width="132" height="58" rx="29" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="30" cy="29" r="15" fill="#DE127A"/>
    <path d="M23 29l5 5 9-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="26" font-family="Plus Jakarta Sans, Poppins, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Siap Cetak</text>
    <text x="52" y="42" font-family="Plus Jakarta Sans, Poppins, sans-serif" font-size="10" font-weight="600" fill="#64748B">Cutline rapi</text>
  </g>

  <!-- sparkle -->
  <g fill="#fff" opacity="0.9">
    <path d="M560 60l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M70 340l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity="0.7"/>
  </g>
  <circle cx="596" cy="180" r="7" fill="#F4A261"/>
  <circle cx="46" cy="250" r="5" fill="#fff" opacity="0.6"/>
</svg>
