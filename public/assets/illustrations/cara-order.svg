<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="Ilustrasi cara order BisaPrint">
  <rect width="400" height="300" fill="#F8FAFC" rx="16"/>
  <rect x="40" y="60" width="320" height="200" rx="20" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Step 1 -->
  <circle cx="80" cy="110" r="24" fill="#ffffff" stroke="#DE127A" stroke-width="2"/>
  <text x="80" y="116" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#DE127A" text-anchor="middle">1</text>
  <rect x="120" y="95" width="80" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Arrow 1 -->
  <path d="M210 110h40" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
  <path d="M245 102l8 8-8 8" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <circle cx="290" cy="110" r="24" fill="#ffffff" stroke="#E87817" stroke-width="2"/>
  <text x="290" y="116" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#E87817" text-anchor="middle">2</text>

  <!-- Arrow 2 -->
