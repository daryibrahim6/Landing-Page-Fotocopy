  <path d="M282 186l8 8 8-8" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <circle cx="290" cy="220" r="24" fill="#ffffff" stroke="#DE127A" stroke-width="2"/>
  <text x="290" y="226" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#DE127A" text-anchor="middle">3</text>

  <!-- Package result -->
  <rect x="110" y="185" width="90" height="70" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="120" y="200" width="70" height="10" rx="5" fill="#E2E8F0"/>
  <circle cx="135" cy="230" r="8" fill="#DE127A" opacity="0.15"/>
  <path d="M130 230l3 3 6-6" stroke="#DE127A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
