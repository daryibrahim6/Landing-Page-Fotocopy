<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="Ilustrasi tim percetakan BisaPrint">
  <rect width="400" height="300" fill="#F8FAFC" rx="16"/>
  <!-- Background jar shape -->
  <rect x="40" y="60" width="320" height="200" rx="20" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Printer -->
  <rect x="120" y="120" width="160" height="90" rx="12" fill="#F1F5F9" stroke="#DE127A" stroke-width="2"/>
  <rect x="135" y="140" width="130" height="45" rx="6" fill="#ffffff"/>
  <circle cx="165" cy="162" r="8" fill="#DE127A" opacity="0.2"/>
  <rect x="185" y="156" width="60" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="120" y="210" width="160" height="18" rx="4" fill="#DE127A" opacity="0.1"/>

  <!-- Person 1 -->
  <circle cx="80" cy="100" r="22" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M58 150c0-16 10-28 22-28s22 12 22 28v30H58v-30z" fill="#DE127A" opacity="0.1"/>
  <path d="M70 95c0-6 4-10 10-10s10 4 10 10" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Person 2 -->
  <circle cx="320" cy="100" r="22" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M298 150c0-16 10-28 22-28s22 12 22 28v30H298v-30z" fill="#E87817" opacity="0.1"/>
  <path d="M310 95c0-6 4-10 10-10s10 4 10 10" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Paper stack -->
  <rect x="220" y="80" width="70" height="50" rx="4" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="225" y="85" width="60" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="225" y="95" width="45" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="225" y="105" width="50" height="6" rx="3" fill="#E2E8F0"/>

  <!-- Title on paper -->
  <text x="74" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Cepat</text>
  <text x="200" y="260" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">BisaPrint</text>
  <text x="320" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Rapi</text>
</svg>
